# Started by `make up` (which also starts llama-server natively on the host).
# The web UI is served by the gateway: http://localhost:8000
services:
  forecast:
    build: .
    command: uvicorn store.forecast_stub:app --host 0.0.0.0 --port 8001
    environment:
      STORE_DB_PATH: /app/data/runtime/store.db
    volumes:
      - ./data:/app/data:ro
    ports: ["8001:8001"]

  gateway:
    build: .
    command: uvicorn serve.gateway.app:app --host 0.0.0.0 --port 8000
    env_file: .env  # escalation endpoint + key, GATEWAY_API_KEY
    environment:
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_MODEL: ${LLM_MODEL:-storeops-3b-q4_k_m}
      FORECAST_URL: http://forecast:8001
      STORE_DB_PATH: /app/data/runtime/store.db
    volumes:
      - ./data:/app/data  # read-write: staged and confirmed orders
    ports: ["8000:8000"]
    depends_on: [forecast]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./serve/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/storeops.json
    volumes:
      - ./serve/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./serve/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
