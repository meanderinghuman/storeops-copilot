[project]
name = "storeops-copilot"
version = "0.1.0"
description = "Small fine-tuned tool-calling model for store inventory questions, served locally."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
tokenize = [
    "jinja2>=3.1.6",
    "transformers>=4.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]
