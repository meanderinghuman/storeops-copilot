name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        # Tests that need the real M5 database or test set skip; everything else runs on a
        # synthetic M5-format fixture (store, tools, forecast, agent, scorer, gateway safety).
        run: uv run pytest -q
